[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlit-casepilot"
version = "1.0.0"
description = "Evidence-grounded Streamlit support with durable human-approved local actions"
requires-python = ">=3.11"
dependencies = ["tiktoken==0.14.0", "jsonschema==4.26.0"]

[project.optional-dependencies]
notebook = ["jupyterlab==4.4.9", "nbclient==0.10.2", "ipykernel==6.30.1"]

[project.scripts]
casepilot = "casepilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
casepilot = ["web/*.html"]
